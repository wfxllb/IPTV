name: Daily Update

# 说明：本工作流的自动清洗已全部停用（仅保留手动触发，供应急备份）。
# 原因：GitHub 云端（美国服务器）测速的地理视角与用户实际收视网络（东莞移动）
# 严重不符——云端判定"快速可用"的线路在本地大量超时，反之亦然。
# 每日清洗改由用户本机（东莞移动网络）执行，结果直接推送 live.m3u。
on:
  workflow_dispatch:

concurrency:
  group: live-update
  cancel-in-progress: true

jobs:
  run_script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        sudo apt-get install -y ffmpeg
        pip install requests aiohttp

    - name: Run Python script
      run: python main.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f live.m3u live.txt function.log
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update live files"
          echo "=== worktree status before sync ==="
          git status --porcelain
          git -c rebase.autoStash=true pull --rebase -X theirs origin main
          git push
        fi

    env:
      TZ: Asia/Shanghai
